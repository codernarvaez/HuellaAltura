name: HABack CI

on:
  push:
    branches: [main, master, develop, landingPage]
    paths:
      - "HABack/**"
      - "pants.toml"
      - "BUILD"
      - ".github/workflows/haback-ci.yml"
  pull_request:
    paths:
      - "HABack/**"
      - "pants.toml"
      - "BUILD"
      - ".github/workflows/haback-ci.yml"

concurrency:
  group: haback-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit-auth:
    name: pip-audit (auth-service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Audit auth-service dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r HABack/auth-service/requirements.txt --strict --desc on

  pip-audit-exped:
    name: pip-audit (exped-service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Audit exped-service dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r HABack/exped-service/requirements.txt --strict --desc on

  # Note: GitHub Dependency review requires Dependency graph (Advanced Security /
  # public-repo graph). This repo uses pip-audit above instead.

  pants:
    name: Pants CI (HABack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [pip-audit-auth, pip-audit-exped]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            HABack/auth-service/requirements*.txt
            HABack/exped-service/requirements*.txt

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Setup Pants
        uses: pantsbuild/actions/init-pants@v10
        with:
          gha-cache-key: haback-pants-shell-v1
          named-caches-hash: ${{ hashFiles('HABack/**/requirements*.txt', 'pants.toml', 'HABack/**/BUILD') }}

      - name: Install Python tooling on PATH
        run: |
          python -m pip install --upgrade pip
          pip install -r HABack/auth-service/requirements-dev.txt
          pip install -r HABack/exped-service/requirements-dev.txt
          npm install --prefix HABack/auth-service --no-save prisma@5.22.0
          npm install --prefix HABack/exped-service --no-save prisma@5.22.0

      - name: Pants list HABack targets
        run: "pants list HABack::"

      # Run CI scripts directly so ruff/pytest/prisma from PATH are available.
      # (pants run sandboxes the process and often hides host tooling.)
      - name: auth-service CI
        run: bash ./HABack/auth-service/pants_ci.sh
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
          SECRET_KEY: ci-test-secret
          INTERNAL_API_KEY: ci-test-internal

      - name: exped-service CI
        run: bash ./HABack/exped-service/pants_ci.sh
        env:
          DATABASE_URL: "file:./.test_geoguard.db"
          SECRET_KEY: ci-test-secret
          INTERNAL_API_KEY: ci-test-internal
          SESSION_VALIDATION_ENABLED: "false"
