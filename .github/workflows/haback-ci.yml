name: HABack CI

on:
  push:
    branches: [main, master, develop, landingPage]
    paths:
      - "HABack/**"
      - "pants.toml"
      - "BUILD"
      - ".github/workflows/haback-ci.yml"
  pull_request:
    paths:
      - "HABack/**"
      - "pants.toml"
      - "BUILD"
      - ".github/workflows/haback-ci.yml"

concurrency:
  group: haback-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit-auth:
    name: pip-audit (auth-service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Audit auth-service dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r HABack/auth-service/requirements.txt --strict --desc on

  pip-audit-exped:
    name: pip-audit (exped-service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Audit exped-service dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r HABack/exped-service/requirements.txt --strict --desc on

  pants:
    name: Pants CI (HABack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [pip-audit-auth, pip-audit-exped]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            HABack/auth-service/requirements*.txt
            HABack/exped-service/requirements*.txt

      - name: Require Neon test database secret
        env:
          NEON_TEST_DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
        run: |
          if [ -z "${NEON_TEST_DATABASE_URL}" ]; then
            echo "::error::Missing GitHub secret NEON_TEST_DATABASE_URL"
            exit 1
          fi

      - name: Setup Pants
        uses: pantsbuild/actions/init-pants@v10
        with:
          gha-cache-key: haback-pants-shell-v1
          named-caches-hash: ${{ hashFiles('HABack/**/requirements*.txt', 'pants.toml', 'HABack/**/BUILD') }}

      - name: Install Python tooling on PATH
        run: |
          python -m pip install --upgrade pip
          pip install -r HABack/auth-service/requirements-dev.txt
          pip install -r HABack/exped-service/requirements-dev.txt

      - name: Pants list HABack targets
        run: "pants list HABack::"

      # Host PATH: Pants sandbox hides ruff/pytest/prisma.
      # NEON_TEST_DATABASE_URL only — never DATABASE_URL / NEON_PROD_* on PRs.
      - name: auth-service CI
        run: bash ./HABack/auth-service/pants_ci.sh
        env:
          DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
          SECRET_KEY: ${{ secrets.CI_SECRET_KEY || 'ci-test-secret' }}
          INTERNAL_API_KEY: ${{ secrets.CI_INTERNAL_API_KEY || 'ci-test-internal' }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'agrobamba-cia-ltda' }}
          PRISMA_DB_PUSH: "1"

      # Do not prisma db push here: auth and exped schemas cannot share one Neon URL.
      # Set NEON_TEST_DATABASE_URL_EXPED to a second Neon database to enable schema sync.
      - name: exped-service CI
        run: bash ./HABack/exped-service/pants_ci.sh
        env:
          DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
          SECRET_KEY: ${{ secrets.CI_SECRET_KEY || 'ci-test-secret' }}
          INTERNAL_API_KEY: ${{ secrets.CI_INTERNAL_API_KEY || 'ci-test-internal' }}
          SESSION_VALIDATION_ENABLED: "false"
          PRISMA_DB_PUSH: "0"

  # -------------------------------------------------------------------------
  # Production schema deploy (Neon main branch)
  # -------------------------------------------------------------------------
  # Runs only on push to main/master after Pants CI is green.
  # Uses NEON_PROD_DB_URL_* — never the test URL. Optional GitHub Environment
  # "production" enables required reviewers / wait timers in repo settings.
  neon-migrate-prod:
    name: Neon schema deploy (production)
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [pants]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: haback-neon-prod-migrate
      cancel-in-progress: false
    env:
      NEON_PROD_DB_URL_AUTH: ${{ secrets.NEON_PROD_DB_URL_AUTH || secrets.NEON_PROD_DB_URL || secrets.DATABASE_URL }}
      NEON_PROD_DB_URL_EXPED: ${{ secrets.NEON_PROD_DB_URL_EXPED || secrets.NEON_PROD_DB_URL || secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            HABack/auth-service/requirements*.txt
            HABack/exped-service/requirements*.txt

      - name: Require Neon production database secrets
        run: |
          missing=0
          if [ -z "${NEON_PROD_DB_URL_AUTH}" ]; then
            echo "::error::Missing secret NEON_PROD_DB_URL_AUTH (or NEON_PROD_DB_URL / DATABASE_URL)"
            missing=1
          fi
          if [ -z "${NEON_PROD_DB_URL_EXPED}" ]; then
            echo "::error::Missing secret NEON_PROD_DB_URL_EXPED (or NEON_PROD_DB_URL / DATABASE_URL)"
            missing=1
          fi
          exit "$missing"

      - name: Install Prisma Python clients
        run: |
          python -m pip install --upgrade pip
          pip install -r HABack/auth-service/requirements.txt
          pip install -r HABack/exped-service/requirements.txt

      - name: auth-service prisma generate + db push (production)
        working-directory: HABack/auth-service
        env:
          DATABASE_URL: ${{ env.NEON_PROD_DB_URL_AUTH }}
        run: |
          set -euo pipefail
          python -m prisma generate
          # No --accept-data-loss on production. Fail closed if destructive.
          python -m prisma db push

      - name: exped-service prisma generate + db push (production)
        working-directory: HABack/exped-service
        env:
          DATABASE_URL: ${{ env.NEON_PROD_DB_URL_EXPED }}
        run: |
          set -euo pipefail
          python -m prisma generate
          python -m prisma db push
