name: HAFront CI

on:
  push:
    branches: [main, master, develop, landingPage]
    paths:
      - "HAFront/**"
      - "package.json"
      - "package-lock.json"
      - "pants.toml"
      - ".github/workflows/hafront-ci.yml"
  pull_request:
    paths:
      - "HAFront/**"
      - "package.json"
      - "package-lock.json"
      - "pants.toml"
      - ".github/workflows/hafront-ci.yml"

concurrency:
  group: hafront-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: HAFront CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Pants
        uses: pantsbuild/actions/init-pants@v10
        with:
          gha-cache-key: hafront-pants-v1
          named-caches-hash: ${{ hashFiles('HAFront/package.json', 'pants.toml', 'HAFront/BUILD') }}

      - name: Run HAFront CI via Pants
        run: pants run HAFront:ci
        env:
          CI: true
          PUBLIC_SITE_URL: http://127.0.0.1:4321
          # Fallbacks so check/build stay green in forks/demos without repo secrets.
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY || 'public-anon-key-ci' }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hafront-dist
          path: HAFront/dist
          retention-days: 7
          if-no-files-found: error
