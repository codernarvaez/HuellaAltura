name: HAContract CI

on:
  push:
    branches: [main, master, develop, develop-diego]
    paths:
      - "HAContract/**"
      - "HAFront/src/lib/chain/**"
      - ".github/workflows/hacontract-ci.yml"
  pull_request:
    paths:
      - "HAContract/**"
      - "HAFront/src/lib/chain/**"
      - ".github/workflows/hacontract-ci.yml"

concurrency:
  group: hacontract-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Hardhat (lint, tipos, pruebas y cobertura)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: HAContract

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: HAContract/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (solhint)
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: ABI y direcciones de HAFront al día (T02)
        run: npm run export:front:check

      - name: Typecheck scripts
        run: npm run typecheck

      - name: Test con reporte de gas
        run: npm run test:gas

      - name: Coverage
        run: npm run coverage
