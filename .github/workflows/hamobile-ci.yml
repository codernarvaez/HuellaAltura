name: HAMobile CI

on:
  push:
    branches: [main, master, develop, landingPage]
    paths:
      - "HAMobile/**"
      - "package.json"
      - "package-lock.json"
      - "pants.toml"
      - ".github/workflows/hamobile-ci.yml"
  pull_request:
    paths:
      - "HAMobile/**"
      - "package.json"
      - "package-lock.json"
      - "pants.toml"
      - ".github/workflows/hamobile-ci.yml"

concurrency:
  group: hamobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: HAMobile CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install monorepo dependencies
        run: npm ci

      - name: Setup Pants
        uses: pantsbuild/actions/init-pants@v10
        with:
          gha-cache-key: hamobile-pants-v1
          named-caches-hash: ${{ hashFiles('HAMobile/package.json', 'pants.toml', 'HAMobile/BUILD') }}

      - name: Run HAMobile CI via Pants
        run: pants run HAMobile:ci
