# Static site — landing Agrobamba (Vue 3 + Vite)
# Aplicar vía Dashboard: https://dashboard.render.com/blueprint/new?repo=https://github.com/codernarvaez/LoxadevCoffe
services:
  - type: web
    name: agrobamba-landing
    runtime: static
    plan: free
    rootDir: HAgrobamba/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      # SPA / anchors: cualquier ruta desconocida → index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
