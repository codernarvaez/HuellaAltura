# Web Service — landing Agrobamba (Vue 3 + Vite → serve dist)
# Crear en Dashboard: New → Web Service (no hace falta Apply Blueprint).
services:
  - type: web
    name: agrobamba-landing
    runtime: node
    plan: free
    rootDir: HAgrobamba/frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
