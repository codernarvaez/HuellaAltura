<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Restablecer contraseña — {{ app_name }}</title>
</head>
<body style="margin:0;padding:0;background:#fefae3;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:#2b361c;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fefae3;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" style="max-width:600px;background:#ffffff;border:2px solid #636b3f;border-radius:15px;padding:40px;">
          <tr>
            <td>
              <h1 style="margin:0 0 8px;font-size:22px;color:#2b361c;">{{ app_name }}</h1>
              <h2 style="margin:0 0 16px;color:#636b3f;">Restablecer contraseña</h2>
              <p style="margin:0 0 12px;line-height:1.6;">Hola {{ first_name }},</p>
              <p style="margin:0 0 28px;line-height:1.6;">
                Recibimos una solicitud para restablecer tu contraseña.
                Este enlace caduca en <strong>{{ expires_minutes }} minutos</strong>.
              </p>
              <table role="presentation" width="100%">
                <tr>
                  <td align="center" style="padding:8px 0 28px;">
                    <a href="{{ reset_url }}"
                       style="background:#636b3f;color:#fefae3;text-decoration:none;padding:14px 28px;border-radius:8px;font-weight:700;display:inline-block;border:1px solid #2b361c;">
                      Crear nueva contraseña
                    </a>
                  </td>
                </tr>
              </table>
              <p style="margin:0;font-size:13px;color:#b17036;line-height:1.5;">
                Si no solicitaste este cambio, ignora este correo. Tu contraseña no cambiará.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
